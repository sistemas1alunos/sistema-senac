<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22> </text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> 👤 Ficha do Aluno • Senac 2026</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  /* CSS extra para alinhar os campos da ficha perfeitamente */
  .ficha-grid {
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 15px; 
    margin-bottom: 15px;
  }
  @media (max-width: 600px) {
    .ficha-grid { grid-template-columns: 1fr; }
  }
  .ficha-label {
    font-size: 13px; 
    font-weight: bold; 
    color: var(--marinho); 
    display: block; 
    margin-bottom: 5px;
  }
  .ficha-input {
    width: 100%; 
    padding: 12px; 
    border: 2px solid #e2e8f0; 
    border-radius: 8px; 
    font-size: 14px;
    transition: all 0.3s ease;
  }
  .ficha-input:disabled {
    background: #f8fafc;
    color: #475569;
  }
</style>
</head>
<body style="background: var(--bg);">

<header class="topbar">
  <div class="logo"> SENAC <span>2026</span></div>
  <nav>
    <a href="/" class="sair" style="color: white; text-decoration: none; font-weight: bold;">← Voltar ao Painel</a>
  </nav>
</header>

<main style="padding: 30px; max-width: 800px; margin: 0 auto; padding-bottom: 100px;">
  
  <div class="ficha-header" style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(10,31,68,0.08);">
    <img id="fichaFoto" src="" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--laranja);">
    <div>
      <h2 id="fichaNome" style="margin: 0; color: var(--marinho);"></h2>
      <p id="fichaTurmaTurno" style="color: #64748b; font-size: 16px; margin-top: 5px;"></p>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h3 style="color: var(--marinho); margin: 0;">Dados Sensíveis e de Saúde</h3>
    <button id="btnOlho" onclick="togglePrivacidade()" style="background: none; border: 2px solid var(--marinho); border-radius: 8px; padding: 8px 15px; cursor: pointer; font-size: 14px; font-weight: bold; color: var(--marinho); display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
      👁️ Mostrar Dados
    </button>
  </div>

  <div id="dadosSensiveis" style="background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(10,31,68,0.08); filter: blur(6px); pointer-events: none; opacity: 0.7; transition: all 0.3s ease;">
    
    <div class="ficha-grid">
      <div>
        <label class="ficha-label">Data de Nascimento</label>
        <input type="text" id="dataNascimento" class="ficha-input" disabled>
      </div>
      <div>
        <label class="ficha-label">Nome do Responsável</label>
        <input type="text" id="nomeResponsavel" class="ficha-input" disabled>
      </div>
    </div>
    
    <div class="ficha-grid">
      <div>
        <label class="ficha-label">Telefone do Responsável</label>
        <input type="text" id="telefoneResponsavel" class="ficha-input" disabled>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label class="ficha-label">Especificidade (TDAH, TEA, etc.)</label>
      <textarea id="especificidade" class="ficha-input" disabled style="min-height: 80px; resize: vertical;"></textarea>
    </div>

    <div style="margin-bottom: 20px;">
      <label class="ficha-label">Observações Médicas / Alergias</label>
      <textarea id="observacoesMedicas" class="ficha-input" disabled style="min-height: 80px; resize: vertical;"></textarea>
    </div>

    <div style="display: flex; gap: 10px;">
      <button id="btnEditar" onclick="ativarEdicao()" style="flex: 1; padding: 14px; background: var(--marinho); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;">✏️ Editar Informações</button>
      <button id="btnSalvar" onclick="salvarFicha()" style="flex: 1; padding: 14px; background: #059669; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; display: none;">💾 Salvar Alterações</button>
    </div>
  </div>

</main>

<script>
let alunoId = window.location.pathname.split('/').pop();

// Carrega os dados da API
async function carregarFicha() {
  try {
    const r = await fetch(`/api/alunos/${alunoId}`);
    if (!r.ok) { alert("Erro ao carregar ficha"); return; }
    const dadosAluno = await r.json();
    
    document.getElementById('fichaNome').innerText = dadosAluno.nome;
    document.getElementById('fichaTurmaTurno').innerText = `Turma ${dadosAluno.turma} • Turno ${dadosAluno.turno}`;
    
    if (dadosAluno.foto) {
      document.getElementById('fichaFoto').src = `/uploads/${dadosAluno.foto}`;
    } else {
      document.getElementById('fichaFoto').style.display = 'none';
    }

    // Preenche os campos
    document.getElementById('dataNascimento').value = dadosAluno.data_nascimento || '';
    document.getElementById('nomeResponsavel').value = dadosAluno.nome_responsavel || '';
    document.getElementById('telefoneResponsavel').value = dadosAluno.telefone_responsavel || '';
    document.getElementById('especificidade').value = dadosAluno.especificidade || '';
    document.getElementById('observacoesMedicas').value = dadosAluno.observacoes_medicas || '';
  } catch (e) {
    console.error(e);
  }
}
carregarFicha();

// Lógica do Olhinho (Privacidade)
let dadosVisiveis = false;
function togglePrivacidade() {
  dadosVisiveis = !dadosVisiveis;
  const div = document.getElementById('dadosSensiveis');
  const btn = document.getElementById('btnOlho');
  
  if (dadosVisiveis) {
    div.style.filter = 'none';
    div.style.opacity = '1';
    div.style.pointerEvents = 'auto';
    btn.innerHTML = '🙈 Ocultar Dados';
    btn.style.background = 'var(--laranja)';
    btn.style.color = 'white';
    btn.style.borderColor = 'var(--laranja)';
  } else {
    div.style.filter = 'blur(6px)';
    div.style.opacity = '0.7';
    div.style.pointerEvents = 'none';
    btn.innerHTML = '👁️ Mostrar Dados';
    btn.style.background = 'none';
    btn.style.color = 'var(--marinho)';
    btn.style.borderColor = 'var(--marinho)';
  }
}

// Lógica de Edição
function ativarEdicao() {
  const inputs = document.querySelectorAll('#dadosSensiveis input, #dadosSensiveis textarea');
  inputs.forEach(i => {
    i.disabled = false;
    i.style.background = 'white';
    i.style.borderColor = 'var(--laranja)';
  });
  document.getElementById('btnEditar').style.display = 'none';
  document.getElementById('btnSalvar').style.display = 'block';
}

// Função de Salvar
async function salvarFicha() {
  const btnSalvar = document.getElementById('btnSalvar');
  btnSalvar.innerText = '⏳ Salvando...';
  btnSalvar.disabled = true;

  const payload = {
    data_nascimento: document.getElementById('dataNascimento').value,
    nome_responsavel: document.getElementById('nomeResponsavel').value,
    telefone_responsavel: document.getElementById('telefoneResponsavel').value,
    especificidade: document.getElementById('especificidade').value,
    observacoes_medicas: document.getElementById('observacoesMedicas').value
  };
  
  try {
    const r = await fetch(`/api/alunos/${alunoId}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    
    if (r.ok) {
      alert('✅ Dados salvos com sucesso!');
      
      // Volta ao estado de leitura
      const inputs = document.querySelectorAll('#dadosSensiveis input, #dadosSensiveis textarea');
      inputs.forEach(i => {
        i.disabled = true;
        i.style.background = '#f8fafc';
        i.style.borderColor = '#e2e8f0';
      });
      
      document.getElementById('btnEditar').style.display = 'block';
      btnSalvar.style.display = 'none';
    } else {
      alert('❌ Erro ao salvar os dados no servidor.');
    }
  } catch (error) {
    alert('❌ Erro de conexão. Verifique a internet.');
  } finally {
    btnSalvar.innerText = '💾 Salvar Alterações';
    btnSalvar.disabled = false;
  }
}
</script>
</body>
</html>
